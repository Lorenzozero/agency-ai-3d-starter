# Pool ultra-veloce (NVIDIA NIM + Groq LPU + Gemini) per abbattere i tempi di risposta
upstream: https://openrouter.ai/api
listen: {host: 127.0.0.1, port: 8099}
cooldown_s: 15
max_wait_s: 4
timeout_s: 30
limits:
  free_per_minute: 30
  free_per_day: 100
  paid_usd_per_day: 1.00
allow_paid: false
tier_order: [nvidia, groq, gemini, github, openrouter]
providers:
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    key_env: NVIDIA_API_KEY
    free: true
    max_input_tokens: 128000
    max_tokens: 4096
  groq:
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    free: true
    max_input_tokens: 6500
    max_tokens: 2048
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    key_env: GEMINI_FREE_API_KEY
    free: true
    max_input_tokens: 120000
    max_tokens: 4096
    tool_call_extra: {extra_content: {google: {thought_signature: skip_thought_signature_validator}}}
  github:
    base_url: https://models.github.ai/inference
    key_env: GITHUB_MODELS_TOKEN
    free: true
    max_input_tokens: 7500
    max_tokens: 2048
pools:
  strong:
    - {model: "poolside/laguna-xs-2.1", provider: nvidia}
    - {model: "openai/gpt-oss-120b", provider: groq}
    - {model: "nvidia/nemotron-3.5-super-vl-120b-a12b", provider: nvidia}
    - {model: "gemini-3.5-flash", provider: gemini}
  light:
    - {model: "openai/gpt-oss-20b", provider: groq}
    - {model: "poolside/laguna-xs-2.1", provider: nvidia}
    - {model: "qwen/qwen3.8-27b", provider: groq}
    - {model: "nvidia/nemotron-3.5-lightning-30b-a3b", provider: nvidia}
    - {model: "gemini-3.1-flash-lite", provider: gemini}
